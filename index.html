<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  MEAL ROTA — HANDOFF NOTES (read this first in any new Claude chat)
  ═══════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A single-file PWA for a 4-week rotating family meal template (Week A/B/C/D).
  Replaces an older per-person Lunch/Tea grid app (bengalebg23/Meal-planner)
  which was too fiddly to keep up with day to day. This version: one Lunch +
  one Tea slot per day for the whole family, with an optional adults-eat-
  different slot toggled per day. Repo: bengalebg23/MealRota, served via
  GitHub Pages at bengalebg23.github.io/MealRota/.

  ARCHITECTURE
  - Single index.html, vanilla JS, no build step, no frameworks.
  - UNIFIED_MEALS array = the meal bank (name + tags: when/protein/who/speed/style).
    Carried over from the old Meal-planner app's meal bank, plus meals agreed
    during the planning conversation (sausage pasta, chicken Kiev, jar curry,
    salmon teriyaki, bacon carbonara, etc).
  - template object = the 4-week plan: template[weekKey][dayKey] = 
    { lunch:{family, adults}, tea:{family, adults}, adultsOpen }
  - Persistence: localStorage only (STORE_KEY, ANCHOR_KEY). NOT synced across
    devices yet — Firebase sync (like the Pokedex/House Ledger/Meal-planner
    apps use) was deferred until this simpler shape was confirmed. Still open.
  - "Rota dial" in the header computes which week (A/B/C/D) you're actually
    in this week from an anchor Monday date, cycling automatically every 4
    weeks — this is the whole point of the rebuild (no more weekly re-planning).

  FEATURE HISTORY / CHANGELOG
  v1.7.3 — removed the redundant "Week A" label above the day list in "This
           week" — the active week tab already shows this, so it was wasting
           a row of vertical space for no new information.
  v1.7.2 — reverted filter/sort chips back to their original smaller size (only
           kept the wrap-instead-of-scroll fix, not the bigger sizing from
           v1.6.1 — that was the wrong fix). Compacted the whole "This week"
           view: smaller header/dial/day-cards/pills/spacing throughout, so
           more days are visible on screen at once (previously only Mon–Wed
           fit on a typical phone screen).
  v1.7.1 — the meal-picker sheet's filter chips (quick/medium/slow/chicken/etc,
           shown when tapping a slot in "This week") were still getting clipped
           at the screen edge on horizontal scroll — same issue v1.7.0 fixed for
           the Meal Bank tab, missed here. Now wraps onto multiple lines too,
           with bigger/higher-contrast chips matching the rest of the app.
  v1.7.0 — corrected v1.6.0's assumption: the free-text field belongs in the
           Meal Bank tab itself (adding new meals to the bank, stored separately
           in localStorage as customMeals and merged with UNIFIED_MEALS at
           render time everywhere — bank list AND the weekly picker sheet), not
           just a one-off fill for a single slot. New meals tag themselves to
           the currently active When/protein/speed filters so they're findable.
           Also fixed filter chip rows (Meal Bank + History's day filter) getting
           clipped off-screen — they now wrap onto multiple lines instead of
           relying on horizontal scroll.
  v1.6.1 — filter chips and sort buttons (used in both Meal Bank and History's
           "filter by day" row) were too small/low-contrast. Bumped font size,
           padding, border weight, and label contrast so they're clearly legible.
  v1.6.0 — added a free-text field to the meal-picker sheet (opened by tapping a
           slot in "This week"), so any meal can be typed and assigned directly
           without first existing in UNIFIED_MEALS. Doesn't add it to the meal
           bank itself, just fills that one slot — still worth manually adding
           genuinely new regulars to UNIFIED_MEALS so they're filterable/browsable
           later.
  v1.5.1 — removed the "edit" button from History entries to save space; the
           whole row is now tappable. Tapping a row (or the log card once it's
           loaded for editing) gets a yellow/mustard highlight border so it's
           visually clear which entry you're editing.
  v1.5.0 — History tab: Tea split into separate "adults" and "kids" fields
           (assumption: this applied to the History log, since that's what was
           in focus — Lunch left as a single field). Old {lunch, tea} entries
           auto-migrate to {lunch, teaAdults, teaKids} on load. Entries are now
           a single flex row (day, date, meals, edit button all inline,
           horizontally scrollable if long) instead of two stacked rows.
  v1.4.1 — History tab fixes: entry edit button was getting visually covered by
           the next entry (unclosed float bug), fixed with a proper flex header;
           logged meals now on one compact line (L / T shorthand) instead of two
           rows; entries lead with weekday (Mon/Tue/etc) instead of the date, with
           the date shown small and secondary; added a filter-by-day chip row so
           e.g. all logged Mondays can be viewed together. Push notification setup
           paused at Ben's request — Firebase project name/config not yet supplied.
  v1.4.0 — added a History tab: log what was actually eaten per calendar date
           (lunch + tea, free text), with a "prefill from that day's plan" shortcut
           and a reverse-chronological list of past logged days, tap to edit.
           NOTE: push notification (6pm daily reminder to fill this in) was
           requested but needs a proper backend — Firebase Cloud Messaging +
           a scheduled Cloud Function — which isn't wired up yet. See OPEN
           THREADS below; this is the next thing to build.
  v1.3.0 — Meal Bank now has a "When" filter (all/lunch/tea) alongside protein and
           speed, so lunch and tea meals can be browsed separately.
  v1.2.1 — moved the version number out of the tiny footer into a visible badge
           next to the page title, so it's obvious at a glance without scrolling.
  v1.2.0 — added a Meal Bank browse tab (separate from the weekly rota view):
           meals shown as compact pills (name only, tags hidden until tapped),
           filter by protein + speed, sort by name/protein/speed with grouped
           headers. Folded full handoff notes into this comment block instead
           of a separate file, matching lesson learned on the Pokedex app.
  v1.1.0 — added visible version tag (footer + title); versioned filename
           (meal-rota-vX.X.X.html) adopted to avoid Android's download-suffix
           overwrite issue — same fix used on the Pokedex app.
  v1.0.0 — initial rebuild: single Lunch + Tea slot per day for whole family
           (replacing old per-person grid); adults-separate slot per day via
           small "+" toggle next to day name (originally a full extra always-
           visible row, simplified after feedback); 4-week rotating template
           with header dial; weeks A/B pre-filled with everything agreed during
           planning, C/D open except Saturday roast/lasagne alternation.

  LESSONS LEARNED (carried over from other apps in this family of tools)
  - Android doesn't overwrite same-named downloaded files, it appends a suffix
    (file-20.html etc) — always embed the version number in the filename.
  - Keep the meal bank reusable across rebuilds; it's the expensive part to
    maintain (tags), the grid/UI around it is cheap to redo.

  OPEN THREADS / TODO
  - PUSH NOTIFICATION (in progress): Ben wants a daily 6pm reminder to log what
    was actually eaten (History tab). Chose the "real push notification" route
    over a simple in-app reminder. This needs: (1) a Firebase project with Cloud
    Messaging enabled, (2) a service worker registered client-side to receive
    background push and request notification permission + FCM token, (3) that
    token stored somewhere the scheduler can read it, (4) a Cloud Function on a
    daily Cloud Scheduler trigger (18:00, Europe/London) that sends the push via
    FCM. Steps 2/3 are client code Claude can write directly into index.html;
    steps 1 and 4 need Ben to create the Firebase project and deploy the Cloud
    Function himself (same credential limitation as GitHub push) — Claude can
    write the Cloud Function code for him to deploy via Firebase CLI. Not started.
  - Weeks C and D are still mostly empty (only the Saturday roast/lasagne
    alternation is set).
  - No cross-device sync yet (Firebase, like the other household apps have) —
    could potentially be combined with the Firebase project set up for push
    notifications above, worth doing together rather than twice.
  - Lunch slots are almost entirely unplanned — only Tea has been worked
    through in detail so far.

  HOW TO PICK THIS UP IN A NEW CHAT
  Paste this file (or point at the GitHub repo) and summarise: "continuing
  work on the MealRota app, see the handoff comment at the top of index.html."
  No need to keep one long conversation open — this comment block plus the
  code itself should be enough context for a fresh chat to carry on.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16211f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota">
<title>Meal Rota v1.7.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16211f;
    --surface:#1e2b27;
    --surface-2:#25342f;
    --line:#33443d;
    --paper:#f2ede0;
    --paper-dim:#c8c2b2;
    --muted:#8fa39a;
    --mustard:#d9a441;
    --mustard-dim:#a87f36;
    --rose:#c17a6f;
    --rose-dim:#8f5a52;
    --c-chicken:#d9a441;
    --c-beef:#c17a6f;
    --c-pork:#c48a5c;
    --c-fish:#6fa8a3;
    --c-veggie:#7fa691;
    --c-egg:#cbbf8a;
    --c-default:#8fa39a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 80%, transparent);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:0 0 2px;
  }
  h1.title{
    font-size:21px; font-weight:600; margin:0; letter-spacing:-.01em;
  }
  .title-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 0 9px;
  }
  .version-badge{
    flex:none; font-size:11px; font-weight:600; color:var(--mustard);
    background:var(--surface); border:1px solid var(--mustard-dim);
    padding:4px 9px; border-radius:20px;
  }

  /* ── Rota dial: the signature element ── */
  .dial-row{display:flex; align-items:center; gap:10px;}
  .dial{
    position:relative; width:40px; height:40px; flex:none;
  }
  .dial svg{width:100%; height:100%; display:block;}
  .dial .now-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:var(--mustard);
  }
  .weeks-tabs{display:flex; gap:5px; flex:1;}
  .wk-tab{
    flex:1; text-align:center; padding:6px 0 5px; border-radius:9px;
    background:var(--surface); border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--paper-dim); cursor:pointer; position:relative;
    transition:background .15s, color .15s, border-color .15s;
  }
  .wk-tab .wk-sub{display:block; font-family:'Inter',sans-serif; font-size:8px; font-weight:500; letter-spacing:.06em; margin-top:1px; opacity:.7; text-transform:uppercase;}
  .wk-tab.active{background:var(--mustard); color:#1c1509; border-color:var(--mustard);}
  .wk-tab.is-now::after{
    content:"today"; position:absolute; top:-8px; right:6px;
    font-family:'Inter',sans-serif; font-size:7px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--rose); color:#2a1512; padding:1px 4px; border-radius:5px; font-weight:700;
  }

  main{padding:10px 12px 0;}

  .day-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:11px;
    margin-bottom:6px;
    overflow:hidden;
  }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px 4px 11px;
  }
  .day-name{font-family:'Fraunces',serif; font-weight:600; font-size:14px;}
  .day-head-right{display:flex; align-items:center; gap:6px;}
  .day-note{font-size:9px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .adults-toggle{
    flex:none; width:19px; height:19px; border-radius:50%;
    border:1px solid var(--rose-dim); background:none; color:var(--rose);
    font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .adults-toggle.open{background:var(--rose); color:#2a1512; border-color:var(--rose);}
  .slots{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);}
  .slot{background:var(--surface); padding:5px 8px 6px;}
  .slot-label{
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:3px; display:block;
  }
  .meal-pill{
    display:block; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
    padding:6px 8px; margin-bottom:3px; cursor:pointer; min-height:28px;
    display:flex; align-items:center; line-height:1.2;
  }
  .meal-pill.empty{color:var(--muted); font-style:italic; font-weight:400;}
  .meal-pill.family{border-left:3px solid var(--mustard);}
  .meal-pill.adults{border-left:3px solid var(--rose);}

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:12px 4px 6px;
  }

  /* ── Meal bank sheet ── */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,14,13,.72); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-width:520px; max-height:82vh;
    border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 12px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .sheet-title{font-family:'Fraunces',serif; font-weight:600; font-size:18px;}
  .sheet-close{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:10px; margin-bottom:8px; border-bottom:1px solid var(--line);}
  .chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 11px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--paper-dim);
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--mustard); color:#1c1509; border-color:var(--mustard);}
  .sheet-freetext-row{display:flex; gap:8px; margin-bottom:12px;}
  .sheet-freetext-input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px;
  }
  .sheet-freetext-btn{
    flex:none; background:var(--mustard); color:#1c1509; border:none; border-radius:9px;
    padding:0 16px; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
  }
  .meal-list{overflow-y:auto; flex:1;}
  .meal-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .meal-row-name{font-size:14.5px;}
  .meal-row-tags{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted);}
  .clear-row{color:var(--rose); text-align:center; padding:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;}

  .footer-note{
    text-align:center; color:var(--muted); font-size:11px; font-family:'IBM Plex Mono',monospace;
    padding:12px 20px 6px; line-height:1.5;
  }

  /* ── View switcher ── */
  .view-switch{display:flex; gap:6px; margin-top:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px;}
  .view-btn{
    flex:1; background:none; border:none; padding:6px 0; border-radius:7px;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--paper-dim);
    cursor:pointer;
  }
  .view-btn.active{background:var(--mustard); color:#1c1509;}

  /* ── Meal bank browse ── */
  .bank-add-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin:14px 4px 4px;
  }
  .bank-add-row{display:flex; gap:8px;}
  .bank-add-input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px;
  }
  .bank-add-btn{
    flex:none; background:var(--mustard); color:#1c1509; border:none; border-radius:9px;
    padding:0 16px; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
  }
  .bank-controls{padding:14px 4px 4px;}
  .bank-filter-group{margin-bottom:10px;}
  .bank-filter-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px 4px;}
  .bank-chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .bank-chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 12px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--paper-dim);
    cursor:pointer; white-space:nowrap;
  }
  .bank-chip.active{background:var(--mustard); color:#1c1509; border-color:var(--mustard);}
  .bank-sort-row{display:flex; gap:6px; margin-top:2px;}
  .bank-sort-btn{
    flex:1; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:500; padding:7px 0;
    border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--paper-dim); cursor:pointer;
  }
  .bank-sort-btn.active{background:var(--surface-2); color:var(--paper); border-color:var(--mustard);}

  .bank-group-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--paper-dim);
    margin:16px 4px 8px; text-transform:capitalize;
  }
  .bank-pill-wrap{display:flex; flex-wrap:wrap; gap:7px; padding:0 4px;}
  .bank-pill{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; color:var(--paper);
    background:var(--surface-2); border:1px solid var(--line); border-left-width:3px;
    border-radius:20px; padding:7px 12px; cursor:pointer;
  }
  .bank-pill-tags{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted);
    padding:2px 4px 4px; width:100%;
  }
  .bank-empty{color:var(--muted); font-size:13px; padding:20px 8px; text-align:center;}

  /* ── History tab ── */
  .history-log-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin:14px 4px 18px;
    transition:border-color .15s, box-shadow .15s;
  }
  .history-log-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:10px;}
  .history-date-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .history-date-input{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:7px 9px; flex:1;
  }
  .history-field-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:8px 0 4px;}
  .history-text-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px;
  }
  .history-prefill-btn{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--mustard);
    background:none; border:1px dashed var(--mustard-dim); border-radius:8px;
    padding:5px 9px; cursor:pointer; margin-top:6px;
  }
  .history-save-btn{
    width:100%; margin-top:12px; background:var(--mustard); color:#1c1509; border:none;
    border-radius:9px; padding:10px 0; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .history-entry{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; margin:0 4px 6px;
    display:flex; align-items:center; gap:8px; overflow-x:auto; white-space:nowrap;
    cursor:pointer; transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .history-entry.editing{
    border-color:var(--mustard); box-shadow:0 0 0 2px var(--mustard-dim);
    background:var(--surface-2);
  }
  .history-entry-day{font-family:'Fraunces',serif; font-weight:600; font-size:13px; flex:none;}
  .history-entry-date{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted); flex:none;}
  .history-entry-meals{font-size:12px; color:var(--paper-dim); flex:1;}
  .history-entry-meals b{color:var(--paper); font-weight:600;}
  .history-log-card.editing{
    border-color:var(--mustard); box-shadow:0 0 0 2px var(--mustard-dim);
    transition:border-color .15s, box-shadow .15s;
  }

</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">Family meal rota</p>
  <div class="title-row">
    <h1 class="title display">The Rotation</h1>
    <span class="version-badge mono" id="versionBadge"></span>
  </div>
  <div class="dial-row">
    <div class="dial">

/* ───────────────────────── State / persistence ───────────────────────── */
const STORE_KEY = "mealrota_template_v1";
const ANCHOR_KEY = "mealrota_anchor_v1"; // Monday date string that = start of Week A

function loadTemplate(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplate(t){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(t)); }catch(e){}
}
function getAnchorMonday(){
  let a = localStorage.getItem(ANCHOR_KEY);
  if(!a){
    // default anchor: the most recent Monday
    const now = new Date();
    const day = now.getDay(); // 0 Sun .. 6 Sat
    const diff = (day===0? -6 : 1-day);
    const monday = new Date(now); monday.setDate(now.getDate()+diff);
    a = monday.toISOString().slice(0,10);
    localStorage.setItem(ANCHOR_KEY, a);
  }
  return new Date(a+"T00:00:00");
}
function currentWeekIndex(){
  const anchor = getAnchorMonday();
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0? -6 : 1-day);
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate()+diff);
  const weeksSince = Math.round((thisMonday - anchor) / (7*24*3600*1000));
  return ((weeksSince % 4) + 4) % 4; // 0..3
}

let template = loadTemplate();
let activeWeek = WEEK_KEYS[currentWeekIndex()];
let sheetTarget = null; // {week, day, slot: 'lunch'|'tea', who: 'family'|'adults'}
let sheetFilter = null; // active tag chip

function weekAndDayForDate(dateStr){
  // dateStr: 'YYYY-MM-DD'. Returns {weekKey, dayKey}.
  const anchor = getAnchorMonday();
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  const thatMonday = new Date(d); thatMonday.setDate(d.getDate()+diff);
  const weeksSince = Math.round((thatMonday - anchor) / (7*24*3600*1000));
  const idx = ((weeksSince % 4) + 4) % 4;
  const dayKey = DAYS[(day===0?6:day-1)].key;
  return {weekKey: WEEK_KEYS[idx], dayKey};
}

/* ───────────────────────── Render: header dial + tabs ───────────────────────── */
function renderHeader(){
  const idx = currentWeekIndex();
  document.getElementById('dialLabel').textContent = WEEK_KEYS[idx];
  const arc = document.getElementById('dialArc');
  const circumference = 2*Math.PI*22;
  const quarter = circumference/4;
  arc.setAttribute('stroke-dasharray', `${quarter} ${circumference}`);
  arc.setAttribute('transform', `rotate(${-90 + idx*90} 26 26)`);

  const tabs = document.getElementById('weekTabs');
  tabs.innerHTML = '';
  WEEK_KEYS.forEach((wk,i)=>{
    const el = document.createElement('div');
    el.className = 'wk-tab' + (wk===activeWeek?' active':'') + (i===idx?' is-now':'');
    el.innerHTML = `Week ${wk}<span class="wk-sub">${countFilled(wk)}/14 set</span>`;
    el.onclick = ()=>{ activeWeek = wk; renderAll(); };
    tabs.appendChild(el);
  });
}
function countFilled(wk){
  let n=0;
  DAYS.forEach(d=>{
    const day = template[wk][d.key];
    if(day.lunch.family) n++;
    if(day.tea.family || day.tea.adults) n++;
  });
  return n;
}

/* ───────────────────────── Render: day grid ───────────────────────── */
function pillHtml(text, who, empty){
  const cls = who==='family' ? 'family' : 'adults';
  return `<div class="meal-pill ${cls} ${empty?'empty':''}">${empty ? 'tap to set' : escapeHtml(text)}</div>`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderGrid(){
  const main = document.getElementById('mainGrid');
  main.innerHTML = '';

  DAYS.forEach(d=>{
    const day = template[activeWeek][d.key];
    const note = (DAY_NOTES[activeWeek] && DAY_NOTES[activeWeek][d.key]) || '';
    const card = document.createElement('div');
    card.className = 'day-card';

    const adultsOpen = !!day.adultsOpen;

    card.innerHTML = `
      <div class="day-head">
        <div class="day-name">${d.label}</div>
        <div class="day-head-right">
          <div class="day-note">${note}</div>
          <button class="adults-toggle ${adultsOpen?'open':''}" data-role="adults-toggle" title="Adults eating separately">${adultsOpen ? '−' : '+'}</button>
        </div>
      </div>
      <div class="slots">
        <div class="slot" data-slot="lunch">
          <span class="slot-label">Lunch</span>
          <div data-role="lunch-family"></div>
          <div data-role="lunch-adults-wrap"></div>
        </div>
        <div class="slot" data-slot="tea">
          <span class="slot-label">Tea</span>
          <div data-role="tea-family"></div>
          <div data-role="tea-adults-wrap"></div>
        </div>
      </div>
    `;

    card.querySelector('[data-role="adults-toggle"]').onclick = ()=>{
      day.adultsOpen = !day.adultsOpen;
      if(!day.adultsOpen){ day.lunch.adults = null; day.tea.adults = null; }
      saveTemplate(template);
      renderAll();
    };

    const lunchFamilyWrap = card.querySelector('[data-role="lunch-family"]');
    lunchFamilyWrap.innerHTML = pillHtml(day.lunch.family, 'family', !day.lunch.family);
    lunchFamilyWrap.onclick = ()=> openSheet(d.key, 'lunch', 'family');

    const teaFamilyWrap = card.querySelector('[data-role="tea-family"]');
    teaFamilyWrap.innerHTML = pillHtml(day.tea.family, 'family', !day.tea.family);
    teaFamilyWrap.onclick = ()=> openSheet(d.key, 'tea', 'family');

    const lunchAdultsWrap = card.querySelector('[data-role="lunch-adults-wrap"]');
    if(!adultsOpen){
      lunchAdultsWrap.innerHTML = '';
      lunchAdultsWrap.onclick = null;
    } else if(day.lunch.adults){
      lunchAdultsWrap.innerHTML = pillHtml(day.lunch.adults, 'adults', false);
      lunchAdultsWrap.onclick = ()=> openSheet(d.key, 'lunch', 'adults');
    } else {
      lunchAdultsWrap.innerHTML = pillHtml(null, 'adults', true);
      lunchAdultsWrap.onclick = ()=> openSheet(d.key, 'lunch', 'adults');
    }

    const teaAdultsWrap = card.querySelector('[data-role="tea-adults-wrap"]');
    if(!adultsOpen){
      teaAdultsWrap.innerHTML = '';
      teaAdultsWrap.onclick = null;
    } else if(day.tea.adults){
      teaAdultsWrap.innerHTML = pillHtml(day.tea.adults, 'adults', false);
      teaAdultsWrap.onclick = ()=> openSheet(d.key, 'tea', 'adults');
    } else {
      teaAdultsWrap.innerHTML = pillHtml(null, 'adults', true);
      teaAdultsWrap.onclick = ()=> openSheet(d.key, 'tea', 'adults');
    }

    main.appendChild(card);
  });
}

/* ───────────────────────── Meal bank sheet ───────────────────────── */
const CHIP_TAGS = ["quick","medium","slow","chicken","beef","pork","fish","veggie","egg","pasta","curry"];

function openSheet(dayKey, slot, who){
  sheetTarget = {week:activeWeek, day:dayKey, slot, who};
  sheetFilter = null;
  const dayLabel = DAYS.find(d=>d.key===dayKey).label;
  document.getElementById('sheetTitle').textContent =
    `${dayLabel} ${slot==='lunch'?'lunch':'tea'} — ${who==='family'?'everyone':'adults'}`;
  document.getElementById('sheetFreeText').value = '';
  renderChips();
  renderMealList();
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  sheetTarget = null;
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetBackdrop').addEventListener('click', e=>{
  if(e.target.id==='sheetBackdrop') closeSheet();
});
function useFreeTextMeal(){
  if(!sheetTarget) return;
  const val = document.getElementById('sheetFreeText').value.trim();
  if(!val) return;
  const {week, day, slot, who} = sheetTarget;
  template[week][day][slot][who] = val;
  saveTemplate(template);
  closeSheet();
  renderAll();
}
document.getElementById('sheetFreeTextBtn').onclick = useFreeTextMeal;
document.getElementById('sheetFreeText').addEventListener('keydown', e=>{
  if(e.key === 'Enter') useFreeTextMeal();
});
document.getElementById('clearRow').onclick = ()=>{
  if(!sheetTarget) return;
  const {week, day, slot, who} = sheetTarget;
  template[week][day][slot][who] = null;
  saveTemplate(template);
  closeSheet();
  renderAll();
};

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  CHIP_TAGS.forEach(tag=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (sheetFilter===tag?' active':'');
    chip.textContent = tag;
    chip.onclick = ()=>{ sheetFilter = (sheetFilter===tag ? null : tag); renderChips(); renderMealList(); };
    row.appendChild(chip);
  });
}
function renderMealList(){
  const list = document.getElementById('mealList');
  list.innerHTML = '';
  const when = sheetTarget.slot; // 'lunch' or 'tea'
  let meals = allMeals().filter(m=> m.tags.includes(when));
  if(sheetFilter) meals = meals.filter(m=> m.tags.includes(sheetFilter));
  meals.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'meal-row';
    row.innerHTML = `<span class="meal-row-name">${escapeHtml(m.name)}</span><span class="meal-row-tags mono">${m.tags.filter(t=>t!=='lunch'&&t!=='tea').join(' · ')}</span>`;
    row.onclick = ()=>{
      const {week, day, slot, who} = sheetTarget;
      template[week][day][slot][who] = m.name;
      saveTemplate(template);
      closeSheet();
      renderAll();
    };
    list.appendChild(row);
  });
  if(meals.length===0){
    list.innerHTML = `<div style="padding:20px 4px; color:var(--muted); font-size:13px;">No meals tagged for this yet — add one in the meal bank.</div>`;
  }
}

function speedOf(m){ return SPEED_TAGS.find(t=> m.tags.includes(t)) || null; }
function pillColor(m){
  const p = proteinOf(m);
  return p ? PROTEIN_COLOR[p] : "var(--c-default)";

    chip.className = 'bank-chip' + (bankSpeed===opt.key ? ' active':'');
    chip.textContent = opt.label;
    chip.onclick = ()=>{ bankSpeed = opt.key; renderBankControls(); renderBankList(); };
    speedRow.appendChild(chip);
  });
  speedGroup.appendChild(speedRow);
  wrap.appendChild(speedGroup);

  const sortGroup = document.createElement('div');
  sortGroup.className = 'bank-filter-group';
  sortGroup.innerHTML = `<div class="bank-filter-label">Sort by</div>`;
  const sortRow = document.createElement('div');
  sortRow.className = 'bank-sort-row';
  [{key:'name',label:'A–Z'}, {key:'protein',label:'Protein'}, {key:'speed',label:'Speed'}].forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'bank-sort-btn' + (bankSort===opt.key ? ' active':'');
    btn.textContent = opt.label;
    btn.onclick = ()=>{ bankSort = opt.key; renderBankControls(); renderBankList(); };
    sortRow.appendChild(btn);
  });
  sortGroup.appendChild(sortRow);
  wrap.appendChild(sortGroup);
}

function renderBankList(){
  const list = document.getElementById('bankList');
  list.innerHTML = '';

  let meals = allMeals();
  if(bankWhen) meals = meals.filter(m=> m.tags.includes(bankWhen));
  if(bankProtein) meals = meals.filter(m=> m.tags.includes(bankProtein));
  if(bankSpeed) meals = meals.filter(m=> m.tags.includes(bankSpeed));

  if(meals.length===0){
    list.innerHTML = `<div class="bank-empty">No meals match those filters.</div>`;
    return;
  }

  function renderPillGroup(container, mealsIn){
    const pillWrap = document.createElement('div');
    pillWrap.className = 'bank-pill-wrap';
    mealsIn.slice().sort((a,b)=> a.name.localeCompare(b.name)).forEach(m=>{
      const pill = document.createElement('div');
      pill.className = 'bank-pill';
      pill.style.borderLeftColor = pillColor(m);
      pill.textContent = m.name;
      pill.onclick = ()=>{
        if(bankExpanded.has(m.name)) bankExpanded.delete(m.name); else bankExpanded.add(m.name);
        renderBankList();
      };
      pillWrap.appendChild(pill);
      if(bankExpanded.has(m.name)){
        const tagsEl = document.createElement('div');
        tagsEl.className = 'bank-pill-tags mono';
        tagsEl.textContent = m.tags.join(' · ') + (m.note ? ' · ' + m.note : '');
        pillWrap.appendChild(tagsEl);
      }
    });
    container.appendChild(pillWrap);
  }

  if(bankSort === 'name'){
    renderPillGroup(list, meals);
  } else {
    const groupTags = bankSort === 'protein' ? PROTEIN_TAGS : SPEED_TAGS;
    groupTags.forEach(tag=>{
      const inGroup = meals.filter(m=> m.tags.includes(tag));
      if(inGroup.length===0) return;
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = tag;
      list.appendChild(title);
      renderPillGroup(list, inGroup);
    });
    const rest = meals.filter(m=> !groupTags.some(t=> m.tags.includes(t)));
    if(rest.length){
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = 'other';
      list.appendChild(title);
      renderPillGroup(list, rest);
    }
  }
}

function renderBankView(){
  const bankView = document.getElementById('bankView');
  bankView.innerHTML = `
    <div class="bank-add-card" id="bankAddCard">
      <div class="bank-filter-label" style="margin-bottom:8px;">Add a meal not in the bank</div>
      <div class="bank-add-row">
        <input type="text" class="bank-add-input" id="bankAddInput" placeholder="type a meal name...">
        <button class="bank-add-btn" id="bankAddBtn">add</button>
      </div>
    </div>
    <div class="bank-controls" id="bankControls"></div>
    <div id="bankList"></div>
  `;
  document.getElementById('bankAddBtn').onclick = addCustomMeal;
  document.getElementById('bankAddInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') addCustomMeal();
  });
  renderBankControls();
  renderBankList();
}

function addCustomMeal(){
  const input = document.getElementById('bankAddInput');
  const name = input.value.trim();
  if(!name) return;
  // tag it so it's findable: matches current When/protein/speed filters if set, otherwise both meal times
  const tags = bankWhen ? [bankWhen] : ['lunch','tea'];
  if(bankProtein) tags.push(bankProtein);
  if(bankSpeed) tags.push(bankSpeed);
  customMeals.push({name, tags:[...new Set(tags)]});
  saveCustomMeals(customMeals);
  input.value = '';
  renderBankList();
}

/* ───────────────────────── History (what was actually eaten) ───────────────────────── */
const HISTORY_KEY = "mealrota_history_v1";

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw){
      const h = JSON.parse(raw);
      // migrate old {lunch, tea} entries to {lunch, teaAdults, teaKids}
      Object.keys(h).forEach(d=>{
        if(h[d].tea !== undefined && h[d].teaAdults === undefined && h[d].teaKids === undefined){
          h[d].teaAdults = h[d].tea;
          h[d].teaKids = '';
          delete h[d].tea;
        }
      });
      return h;
    }
  }catch(e){}
  return {}; // { 'YYYY-MM-DD': {lunch:'', teaAdults:'', teaKids:''} }
}
function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){} }
let history = loadHistory();
let historyEditDate = null; // date currently loaded into the log form
let historyDayFilter = null; // e.g. 'mon' or null for all

const SHORT_DAY = {mon:"Mon", tue:"Tue", wed:"Wed", thu:"Thu", fri:"Fri", sat:"Sat", sun:"Sun"};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function dayKeyForDateStr(dateStr){
  const dObj = new Date(dateStr+"T00:00:00");
  const g = dObj.getDay(); // 0 Sun..6 Sat
  return DAYS[g===0?6:g-1].key;
}

function renderHistoryView(){
  const view = document.getElementById('historyView');
  const editDate = historyEditDate || todayStr();
  const existing = history[editDate] || {lunch:'', teaAdults:'', teaKids:''};

  view.innerHTML = `
    <div class="history-log-card${historyEditDate ? ' editing' : ''}">
      <div class="history-log-title display">Log what you actually ate</div>
      <div class="history-date-row">
        <input type="date" class="history-date-input" id="histDate" value="${editDate}">
      </div>
      <div class="history-field-label">Lunch</div>
      <input type="text" class="history-text-input" id="histLunch" placeholder="e.g. leftover pasta" value="${escapeHtml(existing.lunch||'')}">
      <div class="history-field-label">Tea — adults</div>
      <input type="text" class="history-text-input" id="histTeaAdults" placeholder="e.g. salmon teriyaki" value="${escapeHtml(existing.teaAdults||'')}">
      <div class="history-field-label">Tea — kids</div>
      <input type="text" class="history-text-input" id="histTeaKids" placeholder="e.g. fish fingers" value="${escapeHtml(existing.teaKids||'')}">
      <button class="history-prefill-btn" id="histPrefill">↺ prefill from that day's plan</button>
      <button class="history-save-btn" id="histSave">Save this day</button>
    </div>
    <div class="bank-filter-group" style="padding:0 4px;">
      <div class="bank-filter-label">Filter by day</div>
      <div class="bank-chip-row" id="historyDayChips"></div>
    </div>
    <div class="section-label">Past days</div>
    <div id="historyList"></div>
  `;

  document.getElementById('histDate').onchange = (e)=>{ historyEditDate = e.target.value; renderHistoryView(); };
  document.getElementById('histPrefill').onclick = ()=>{
    const d = document.getElementById('histDate').value;
    const {weekKey, dayKey} = weekAndDayForDate(d);
    const day = template[weekKey][dayKey];
    document.getElementById('histLunch').value = day.lunch.adults || day.lunch.family || '';
    document.getElementById('histTeaAdults').value = day.tea.adults || day.tea.family || '';
    document.getElementById('histTeaKids').value = day.tea.family || '';
  };
  document.getElementById('histSave').onclick = ()=>{
    const d = document.getElementById('histDate').value;
    const lunch = document.getElementById('histLunch').value.trim();
    const teaAdults = document.getElementById('histTeaAdults').value.trim();
    const teaKids = document.getElementById('histTeaKids').value.trim();
    if(!lunch && !teaAdults && !teaKids){ delete history[d]; } else { history[d] = {lunch, teaAdults, teaKids}; }
    saveHistory(history);
    historyEditDate = null;
    renderHistoryView();
  };

  renderHistoryDayChips();
  renderHistoryList();
}

function renderHistoryDayChips(){
  const row = document.getElementById('historyDayChips');
  row.innerHTML = '';
  [{key:null,label:'all'}, ...DAYS.map(d=>({key:d.key, label:SHORT_DAY[d.key]}))].forEach(opt=>{
    const chip = document.createElement('div');
    chip.className = 'bank-chip' + (historyDayFilter===opt.key ? ' active':'');
    chip.textContent = opt.label;
    chip.onclick = ()=>{ historyDayFilter = opt.key; renderHistoryDayChips(); renderHistoryList(); };
    row.appendChild(chip);
  });
}

function renderHistoryList(){
  const list = document.getElementById('historyList');
  let dates = Object.keys(history).sort().reverse();
  if(historyDayFilter) dates = dates.filter(d=> dayKeyForDateStr(d)===historyDayFilter);
  if(dates.length===0){
    list.innerHTML = `<div class="bank-empty">No days logged yet.</div>`;
    return;
  }
  list.innerHTML = dates.map(d=>{
    const entry = history[d];
    const dObj = new Date(d+"T00:00:00");
    const dayKey = dayKeyForDateStr(d);
    const dateLabel = dObj.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    const meals = [
      entry.lunch ? `<b>L</b> ${escapeHtml(entry.lunch)}` : '',
      entry.teaAdults ? `<b>TA</b> ${escapeHtml(entry.teaAdults)}` : '',
      entry.teaKids ? `<b>TK</b> ${escapeHtml(entry.teaKids)}` : '',
    ].filter(Boolean).join('  ·  ');
    return `
      <div class="history-entry${d===historyEditDate ? ' editing' : ''}" data-date="${d}">
        <span class="history-entry-day">${SHORT_DAY[dayKey]}</span>
        <span class="history-entry-date">${dateLabel}</span>
        <span class="history-entry-meals">${meals}</span>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.history-entry').forEach(row=>{
    row.onclick = ()=>{ historyEditDate = row.dataset.date; renderHistoryView(); window.scrollTo({top:0, behavior:'smooth'}); };
  });
}

/* ───────────────────────── View switcher ───────────────────────── */
let currentView = 'rota';
function setView(v){
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('mainGrid').style.display = v==='rota' ? '' : 'none';
  document.getElementById('bankView').style.display = v==='bank' ? '' : 'none';
  document.getElementById('historyView').style.display = v==='history' ? '' : 'none';
  if(v==='bank') renderBankView();
  if(v==='history') renderHistoryView();
}
document.querySelectorAll('.view-btn').forEach(b=>{
  b.onclick = ()=> setView(b.dataset.view);
});

/* ───────────────────────── Boot ───────────────────────── */
function renderAll(){ renderHeader(); renderGrid(); }
document.getElementById('versionBadge').textContent = `v${APP_VERSION}`;
document.title = `Meal Rota v${APP_VERSION}`;
renderAll();

// PWA basics
if('serviceWorker' in navigator){
  // no-op placeholder; add sw.js once hosted if offline caching wanted
}
</script>
