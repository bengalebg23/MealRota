<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  MEAL ROTA — HANDOFF NOTES (read this first in any new Claude chat)
  ═══════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A single-file PWA for a 4-week rotating family meal template (Week A/B/C/D).
  Replaces an older per-person Lunch/Tea grid app (bengalebg23/Meal-planner)
  which was too fiddly to keep up with day to day. This version: one Lunch +
  one Tea slot per day for the whole family, with an optional adults-eat-
  different slot toggled per day. Repo: bengalebg23/MealRota, served via
  GitHub Pages at bengalebg23.github.io/MealRota/.

  ARCHITECTURE
  - Single index.html, vanilla JS, no build step, no frameworks.
  - UNIFIED_MEALS array = the meal bank (name + tags: when/protein/who/speed/style).
    Carried over from the old Meal-planner app's meal bank, plus meals agreed
    during the planning conversation (sausage pasta, chicken Kiev, jar curry,
    salmon teriyaki, bacon carbonara, etc).
  - template object = the 4-week plan: template[weekKey][dayKey] = 
    { lunch:{family, adults}, tea:{family, adults}, adultsOpen }
  - Persistence: localStorage only (STORE_KEY, ANCHOR_KEY). NOT synced across
    devices yet — Firebase sync (like the Pokedex/House Ledger/Meal-planner
    apps use) was deferred until this simpler shape was confirmed. Still open.
  - "Rota dial" in the header computes which week (A/B/C/D) you're actually
    in this week from an anchor Monday date, cycling automatically every 4
    weeks — this is the whole point of the rebuild (no more weekly re-planning).

  FEATURE HISTORY / CHANGELOG
  v1.2.1 — moved the version number out of the tiny footer into a visible badge
           next to the page title, so it's obvious at a glance without scrolling.
  v1.2.0 — added a Meal Bank browse tab (separate from the weekly rota view):
           meals shown as compact pills (name only, tags hidden until tapped),
           filter by protein + speed, sort by name/protein/speed with grouped
           headers. Folded full handoff notes into this comment block instead
           of a separate file, matching lesson learned on the Pokedex app.
  v1.1.0 — added visible version tag (footer + title); versioned filename
           (meal-rota-vX.X.X.html) adopted to avoid Android's download-suffix
           overwrite issue — same fix used on the Pokedex app.
  v1.0.0 — initial rebuild: single Lunch + Tea slot per day for whole family
           (replacing old per-person grid); adults-separate slot per day via
           small "+" toggle next to day name (originally a full extra always-
           visible row, simplified after feedback); 4-week rotating template
           with header dial; weeks A/B pre-filled with everything agreed during
           planning, C/D open except Saturday roast/lasagne alternation.

  LESSONS LEARNED (carried over from other apps in this family of tools)
  - Android doesn't overwrite same-named downloaded files, it appends a suffix
    (file-20.html etc) — always embed the version number in the filename.
  - Keep the meal bank reusable across rebuilds; it's the expensive part to
    maintain (tags), the grid/UI around it is cheap to redo.

  OPEN THREADS / TODO
  - Weeks C and D are still mostly empty (only the Saturday roast/lasagne
    alternation is set).
  - No cross-device sync yet (Firebase, like the other household apps have).
  - Lunch slots are almost entirely unplanned — only Tea has been worked
    through in detail so far.

  HOW TO PICK THIS UP IN A NEW CHAT
  Paste this file (or point at the GitHub repo) and summarise: "continuing
  work on the MealRota app, see the handoff comment at the top of index.html."
  No need to keep one long conversation open — this comment block plus the
  code itself should be enough context for a fresh chat to carry on.
  ═══════════════════════════════════════════════════════════════════════
-->

  }
  .bank-empty{color:var(--muted); font-size:13px; padding:20px 8px; text-align:center;}

</style>
</head>

    fri:{lunch:{family:null,adults:null}, tea:{family:null, adults:"Fajitas"}, adultsOpen:true},
    sat:{lunch:{family:null,adults:null}, tea:{family:"Roast", adults:null}, adultsOpen:false},
    sun:{lunch:{family:null,adults:null}, tea:{family:"Fish pie", adults:null}, adultsOpen:false},
  },
  B: {
    mon:{lunch:{family:null,adults:null}, tea:{family:null, adults:null}, adultsOpen:false},
    tue:{lunch:{family:null,adults:null}, tea:{family:null, adults:null}, adultsOpen:false},
    wed:{lunch:{family:null,adults:null}, tea:{family:"Carbonara + garlic bread", adults:null}, adultsOpen:false},
    thu:{lunch:{family:null,adults:null}, tea:{family:null, adults:"Salmon teriyaki + rice + veg"}, adultsOpen:true},
    fri:{lunch:{family:null,adults:null}, tea:{family:null, adults:"Loaded nachos"}, adultsOpen:true},
    sat:{lunch:{family:null,adults:null}, tea:{family:"Lasagne", adults:null}, adultsOpen:false},
    sun:{lunch:{family:null,adults:null}, tea:{family:null, adults:null}, adultsOpen:false},
  },
  C: emptyWeek(),
  D: emptyWeek(),
};
// C and D Saturdays follow the roast/lasagne alternation already agreed
DEFAULT_TEMPLATE.C.sat.tea.family = "Roast";
DEFAULT_TEMPLATE.D.sat.tea.family = "Lasagne";

const DAY_NOTES = {
  A:{mon:"adults only · flap night", tue:"Em solo w/ both kids", wed:"kids + adults separate", thu:"adults only · cook together", fri:"adults only · Mexican night", sat:"everyone · big cook", sun:"everyone · big cook, doubles as leftovers"},
  B:{mon:"adults only", tue:"Em solo w/ both kids", wed:"everyone", thu:"adults only · cook together", fri:"adults only · Mexican night", sat:"everyone · big cook", sun:"everyone · big cook"},
  C:{mon:"adults only", tue:"Em solo w/ both kids", wed:"everyone", thu:"adults only · cook together", fri:"adults only · Mexican night", sat:"everyone · big cook", sun:"everyone · big cook"},
  D:{mon:"adults only", tue:"Em solo w/ both kids", wed:"everyone", thu:"adults only · cook together", fri:"adults only · Mexican night", sat:"everyone · big cook", sun:"everyone · big cook"},
};

/* ───────────────────────── State / persistence ───────────────────────── */
const STORE_KEY = "mealrota_template_v1";
const ANCHOR_KEY = "mealrota_anchor_v1"; // Monday date string that = start of Week A

function loadTemplate(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplate(t){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(t)); }catch(e){}
}
function getAnchorMonday(){
  let a = localStorage.getItem(ANCHOR_KEY);
  if(!a){
    // default anchor: the most recent Monday
    const now = new Date();
    const day = now.getDay(); // 0 Sun .. 6 Sat
    const diff = (day===0? -6 : 1-day);
    const monday = new Date(now); monday.setDate(now.getDate()+diff);
    a = monday.toISOString().slice(0,10);
    localStorage.setItem(ANCHOR_KEY, a);
  }
  return new Date(a+"T00:00:00");
}
function currentWeekIndex(){
  const anchor = getAnchorMonday();
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0? -6 : 1-day);
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate()+diff);
  const weeksSince = Math.round((thisMonday - anchor) / (7*24*3600*1000));
  return ((weeksSince % 4) + 4) % 4; // 0..3
}

let template = loadTemplate();
let activeWeek = WEEK_KEYS[currentWeekIndex()];
let sheetTarget = null; // {week, day, slot: 'lunch'|'tea', who: 'family'|'adults'}
let sheetFilter = null; // active tag chip

/* ───────────────────────── Render: header dial + tabs ───────────────────────── */
function renderHeader(){
  const idx = currentWeekIndex();
  document.getElementById('dialLabel').textContent = WEEK_KEYS[idx];
  const arc = document.getElementById('dialArc');
  const circumference = 2*Math.PI*22;
  const quarter = circumference/4;
  arc.setAttribute('stroke-dasharray', `${quarter} ${circumference}`);
  arc.setAttribute('transform', `rotate(${-90 + idx*90} 26 26)`);

  const tabs = document.getElementById('weekTabs');
  tabs.innerHTML = '';
  WEEK_KEYS.forEach((wk,i)=>{
    const el = document.createElement('div');
    el.className = 'wk-tab' + (wk===activeWeek?' active':'') + (i===idx?' is-now':'');
    el.innerHTML = `Week ${wk}<span class="wk-sub">${countFilled(wk)}/14 set</span>`;
    el.onclick = ()=>{ activeWeek = wk; renderAll(); };
    tabs.appendChild(el);
  });
}
function countFilled(wk){
  let n=0;
  DAYS.forEach(d=>{
    const day = template[wk][d.key];
    if(day.lunch.family) n++;
    if(day.tea.family || day.tea.adults) n++;
  });
  return n;
}

/* ───────────────────────── Render: day grid ───────────────────────── */
function pillHtml(text, who, empty){
  const cls = who==='family' ? 'family' : 'adults';
  return `<div class="meal-pill ${cls} ${empty?'empty':''}">${empty ? 'tap to set' : escapeHtml(text)}</div>`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderGrid(){
  const main = document.getElementById('mainGrid');
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = `Week ${activeWeek}`;
  main.appendChild(label);

  DAYS.forEach(d=>{
    const day = template[activeWeek][d.key];
    const note = (DAY_NOTES[activeWeek] && DAY_NOTES[activeWeek][d.key]) || '';
    const card = document.createElement('div');
    card.className = 'day-card';

    const adultsOpen = !!day.adultsOpen;

    card.innerHTML = `
      <div class="day-head">
        <div class="day-name">${d.label}</div>
        <div class="day-head-right">
          <div class="day-note">${note}</div>
          <button class="adults-toggle ${adultsOpen?'open':''}" data-role="adults-toggle" title="Adults eating separately">${adultsOpen ? '−' : '+'}</button>
        </div>
      </div>
      <div class="slots">
        <div class="slot" data-slot="lunch">
          <span class="slot-label">Lunch</span>
          <div data-role="lunch-family"></div>
          <div data-role="lunch-adults-wrap"></div>
        </div>
        <div class="slot" data-slot="tea">
          <span class="slot-label">Tea</span>
          <div data-role="tea-family"></div>
          <div data-role="tea-adults-wrap"></div>
        </div>
      </div>
    `;

    card.querySelector('[data-role="adults-toggle"]').onclick = ()=>{
      day.adultsOpen = !day.adultsOpen;
      if(!day.adultsOpen){ day.lunch.adults = null; day.tea.adults = null; }
      saveTemplate(template);
      renderAll();
    };

    const lunchFamilyWrap = card.querySelector('[data-role="lunch-family"]');
    lunchFamilyWrap.innerHTML = pillHtml(day.lunch.family, 'family', !day.lunch.family);
    lunchFamilyWrap.onclick = ()=> openSheet(d.key, 'lunch', 'family');

    const teaFamilyWrap = card.querySelector('[data-role="tea-family"]');
    teaFamilyWrap.innerHTML = pillHtml(day.tea.family, 'family', !day.tea.family);
    teaFamilyWrap.onclick = ()=> openSheet(d.key, 'tea', 'family');

    const lunchAdultsWrap = card.querySelector('[data-role="lunch-adults-wrap"]');
    if(!adultsOpen){
      lunchAdultsWrap.innerHTML = '';
      lunchAdultsWrap.onclick = null;
    } else if(day.lunch.adults){
      lunchAdultsWrap.innerHTML = pillHtml(day.lunch.adults, 'adults', false);
      lunchAdultsWrap.onclick = ()=> openSheet(d.key, 'lunch', 'adults');
    } else {
      lunchAdultsWrap.innerHTML = pillHtml(null, 'adults', true);
      lunchAdultsWrap.onclick = ()=> openSheet(d.key, 'lunch', 'adults');
    }

    const teaAdultsWrap = card.querySelector('[data-role="tea-adults-wrap"]');
    if(!adultsOpen){
      teaAdultsWrap.innerHTML = '';
      teaAdultsWrap.onclick = null;
    } else if(day.tea.adults){
      teaAdultsWrap.innerHTML = pillHtml(day.tea.adults, 'adults', false);
      teaAdultsWrap.onclick = ()=> openSheet(d.key, 'tea', 'adults');
    } else {
      teaAdultsWrap.innerHTML = pillHtml(null, 'adults', true);
      teaAdultsWrap.onclick = ()=> openSheet(d.key, 'tea', 'adults');
    }

    main.appendChild(card);
  });
}

/* ───────────────────────── Meal bank sheet ───────────────────────── */
const CHIP_TAGS = ["quick","medium","slow","chicken","beef","pork","fish","veggie","egg","pasta","curry"];

function openSheet(dayKey, slot, who){
  sheetTarget = {week:activeWeek, day:dayKey, slot, who};
  sheetFilter = null;
  const dayLabel = DAYS.find(d=>d.key===dayKey).label;
  document.getElementById('sheetTitle').textContent =
    `${dayLabel} ${slot==='lunch'?'lunch':'tea'} — ${who==='family'?'everyone':'adults'}`;
  renderChips();
  renderMealList();
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  sheetTarget = null;
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetBackdrop').addEventListener('click', e=>{
  if(e.target.id==='sheetBackdrop') closeSheet();
});
document.getElementById('clearRow').onclick = ()=>{
  if(!sheetTarget) return;
  const {week, day, slot, who} = sheetTarget;
  template[week][day][slot][who] = null;
  saveTemplate(template);
  closeSheet();
  renderAll();
};

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  CHIP_TAGS.forEach(tag=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (sheetFilter===tag?' active':'');
    chip.textContent = tag;
    chip.onclick = ()=>{ sheetFilter = (sheetFilter===tag ? null : tag); renderChips(); renderMealList(); };
    row.appendChild(chip);
  });
}
function renderMealList(){
  const list = document.getElementById('mealList');
  list.innerHTML = '';
  const when = sheetTarget.slot; // 'lunch' or 'tea'
  let meals = UNIFIED_MEALS.filter(m=> m.tags.includes(when));
  if(sheetFilter) meals = meals.filter(m=> m.tags.includes(sheetFilter));
  meals.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'meal-row';
    row.innerHTML = `<span class="meal-row-name">${escapeHtml(m.name)}</span><span class="meal-row-tags mono">${m.tags.filter(t=>t!=='lunch'&&t!=='tea').join(' · ')}</span>`;
    row.onclick = ()=>{
      const {week, day, slot, who} = sheetTarget;
      template[week][day][slot][who] = m.name;
      saveTemplate(template);
      closeSheet();
      renderAll();
    };
    list.appendChild(row);
  });
  if(meals.length===0){
    list.innerHTML = `<div style="padding:20px 4px; color:var(--muted); font-size:13px;">No meals tagged for this yet — add one in the meal bank.</div>`;
  }
}

/* ───────────────────────── Meal bank browse view ───────────────────────── */
const PROTEIN_TAGS = ["chicken","beef","pork","fish","veggie","egg"];
const SPEED_TAGS = ["quick","medium","slow"];
const PROTEIN_COLOR = {chicken:"var(--c-chicken)", beef:"var(--c-beef)", pork:"var(--c-pork)", fish:"var(--c-fish)", veggie:"var(--c-veggie)", egg:"var(--c-egg)"};

let bankProtein = null;   // one of PROTEIN_TAGS or null
let bankSpeed = null;     // one of SPEED_TAGS or null
let bankSort = "name";    // "name" | "protein" | "speed"
let bankExpanded = new Set(); // meal names with tags currently shown

function proteinOf(m){ return PROTEIN_TAGS.find(t=> m.tags.includes(t)) || null; }
function speedOf(m){ return SPEED_TAGS.find(t=> m.tags.includes(t)) || null; }
function pillColor(m){
  const p = proteinOf(m);
  return p ? PROTEIN_COLOR[p] : "var(--c-default)";
}

function renderBankControls(){
  const wrap = document.getElementById('bankControls');
  wrap.innerHTML = '';

  const proteinGroup = document.createElement('div');
  proteinGroup.className = 'bank-filter-group';
  proteinGroup.innerHTML = `<div class="bank-filter-label">Protein</div>`;
  const proteinRow = document.createElement('div');
  proteinRow.className = 'bank-chip-row';
  [{key:null,label:'all'}, ...PROTEIN_TAGS.map(t=>({key:t,label:t}))].forEach(opt=>{
    const chip = document.createElement('div');
    chip.className = 'bank-chip' + (bankProtein===opt.key ? ' active':'');
    chip.textContent = opt.label;
    chip.onclick = ()=>{ bankProtein = opt.key; renderBankControls(); renderBankList(); };
    proteinRow.appendChild(chip);
  });
  proteinGroup.appendChild(proteinRow);
  wrap.appendChild(proteinGroup);

  const speedGroup = document.createElement('div');
  speedGroup.className = 'bank-filter-group';
  speedGroup.innerHTML = `<div class="bank-filter-label">Speed</div>`;
  const speedRow = document.createElement('div');
  speedRow.className = 'bank-chip-row';
  [{key:null,label:'all'}, ...SPEED_TAGS.map(t=>({key:t,label:t}))].forEach(opt=>{
    const chip = document.createElement('div');
    chip.className = 'bank-chip' + (bankSpeed===opt.key ? ' active':'');
    chip.textContent = opt.label;
    chip.onclick = ()=>{ bankSpeed = opt.key; renderBankControls(); renderBankList(); };
    speedRow.appendChild(chip);
  });
  speedGroup.appendChild(speedRow);
  wrap.appendChild(speedGroup);

  const sortGroup = document.createElement('div');
  sortGroup.className = 'bank-filter-group';
  sortGroup.innerHTML = `<div class="bank-filter-label">Sort by</div>`;
  const sortRow = document.createElement('div');
  sortRow.className = 'bank-sort-row';
  [{key:'name',label:'A–Z'}, {key:'protein',label:'Protein'}, {key:'speed',label:'Speed'}].forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'bank-sort-btn' + (bankSort===opt.key ? ' active':'');
    btn.textContent = opt.label;
    btn.onclick = ()=>{ bankSort = opt.key; renderBankControls(); renderBankList(); };
    sortRow.appendChild(btn);
  });
  sortGroup.appendChild(sortRow);
  wrap.appendChild(sortGroup);
}

function renderBankList(){
  const list = document.getElementById('bankList');
  list.innerHTML = '';

  let meals = UNIFIED_MEALS.slice();
  if(bankProtein) meals = meals.filter(m=> m.tags.includes(bankProtein));
  if(bankSpeed) meals = meals.filter(m=> m.tags.includes(bankSpeed));

  if(meals.length===0){
    list.innerHTML = `<div class="bank-empty">No meals match those filters.</div>`;
    return;
  }

  function renderPillGroup(container, mealsIn){
    const pillWrap = document.createElement('div');
    pillWrap.className = 'bank-pill-wrap';
    mealsIn.slice().sort((a,b)=> a.name.localeCompare(b.name)).forEach(m=>{
      const pill = document.createElement('div');
      pill.className = 'bank-pill';
      pill.style.borderLeftColor = pillColor(m);
      pill.textContent = m.name;
      pill.onclick = ()=>{
        if(bankExpanded.has(m.name)) bankExpanded.delete(m.name); else bankExpanded.add(m.name);
        renderBankList();
      };
      pillWrap.appendChild(pill);
      if(bankExpanded.has(m.name)){
        const tagsEl = document.createElement('div');
        tagsEl.className = 'bank-pill-tags mono';
        tagsEl.textContent = m.tags.join(' · ') + (m.note ? ' · ' + m.note : '');
        pillWrap.appendChild(tagsEl);
      }
    });
    container.appendChild(pillWrap);
  }

  if(bankSort === 'name'){
    renderPillGroup(list, meals);
  } else {
    const groupTags = bankSort === 'protein' ? PROTEIN_TAGS : SPEED_TAGS;
    groupTags.forEach(tag=>{
      const inGroup = meals.filter(m=> m.tags.includes(tag));
      if(inGroup.length===0) return;
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = tag;
      list.appendChild(title);
      renderPillGroup(list, inGroup);
    });
    const rest = meals.filter(m=> !groupTags.some(t=> m.tags.includes(t)));
    if(rest.length){
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = 'other';
      list.appendChild(title);
      renderPillGroup(list, rest);
    }
  }
}

function renderBankView(){
  const bankView = document.getElementById('bankView');
  bankView.innerHTML = `
    <div class="bank-controls" id="bankControls"></div>
    <div id="bankList"></div>
  `;
  renderBankControls();
  renderBankList();
}

/* ───────────────────────── View switcher ───────────────────────── */
let currentView = 'rota';
function setView(v){
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('mainGrid').style.display = v==='rota' ? '' : 'none';
  document.getElementById('bankView').style.display = v==='bank' ? '' : 'none';
  if(v==='bank') renderBankView();
}
document.querySelectorAll('.view-btn').forEach(b=>{
  b.onclick = ()=> setView(b.dataset.view);
});

/* ───────────────────────── Boot ───────────────────────── */
function renderAll(){ renderHeader(); renderGrid(); }
document.getElementById('versionBadge').textContent = `v${APP_VERSION}`;
document.title = `Meal Rota v${APP_VERSION}`;
renderAll();

// PWA basics
if('serviceWorker' in navigator){
  // no-op placeholder; add sw.js once hosted if offline caching wanted
}
</script>
</body>
</html>
