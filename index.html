<!--
  ═══════════════════════════════════════════════════════════════════════
  MEAL ROTA — HANDOFF NOTES (read this first in any new Claude chat)
  ═══════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  A single-file PWA for a 4-week rotating family meal template (Week A/B/C/D).
  Replaces an older per-person Lunch/Tea grid app (bengalebg23/Meal-planner)
  which was too fiddly to keep up with day to day. This version: one Lunch +
  one Tea slot per day for the whole family, with an optional adults-eat-
  different slot toggled per day. Repo: bengalebg23/MealRota, served via
  GitHub Pages at bengalebg23.github.io/MealRota/.

  ARCHITECTURE
  - Single index.html, vanilla JS, no build step, no frameworks.
  - UNIFIED_MEALS array = the meal bank (name + tags: when/protein/who/speed/style).
    Carried over from the old Meal-planner app's meal bank, plus meals agreed
    during the planning conversation (sausage pasta, chicken Kiev, jar curry,
    salmon teriyaki, bacon carbonara, etc).
  - template object = the 4-week plan: template[weekKey][dayKey] = 
    { lunch:{family, adults}, tea:{family, adults}, adultsOpen }
  - Persistence: localStorage only (STORE_KEY, ANCHOR_KEY). NOT synced across
    devices yet — Firebase sync (like the Pokedex/House Ledger/Meal-planner
    apps use) was deferred until this simpler shape was confirmed. Still open.
  - "Rota dial" in the header computes which week (A/B/C/D) you're actually
    in this week from an anchor Monday date, cycling automatically every 4
    weeks — this is the whole point of the rebuild (no more weekly re-planning).

  FEATURE HISTORY / CHANGELOG
  v2.11.1 — recipe cards now also attach to meals Ben added himself on the
           phone (customMeals), matched to RECIPE_DATA by name ignoring
           case/spaces — previously only built-ins got them, which is why
           his "Chicken mole" had none. Attached as a non-enumerable property
           so it isn't frozen into localStorage (future recipe edits in
           RECIPE_DATA still flow through); a renamed built-in's copied
           recipe is enumerable and kept as-is. applyRecipeTo() runs inside
           allMeals(), so a meal typed in later picks up its card instantly.
           Added recipe + photo (wellplated.com): Chicken mole.
  v2.11.0 — photo banners for 50 of the recipe cards, hotlinked from
           RecipeTin Eats (RECIPE_PHOTOS map, applied in applyRecipeData,
           credited "Photo: RecipeTin Eats"). They're photos of a similar dish,
           not always the exact recipe. Meals with no decent match (toast,
           pâté, fish fingers etc.) have no photo; the banner just doesn't
           show. Same rules as v2.8.1: needs signal, hides itself on failure.
  v2.10.0 — recipe cards for every home-cooked built-in meal (62 new, 63 with the lamb).
           Stored compactly in RECIPE_DATA (i=[qty,unit,item], s=[title,text,
           timerSec]) and expanded onto UNIFIED_MEALS[].recipe at load. Skipped
           on purpose: Karen's, Nursery, MIRA, Snack Attack, Dairylea Dunker,
           Pizza pockets (not cooked at home). Family meals serve 4, adults-
           only and kids-only meals serve 2, big bakes serve 6. qty null =
           "to taste"/as needed (shown as "–"); kg quantities scale in 0.1s.
           Recipes are best-guess standard UK versions tuned to the family's
           notes (hidden-veg sauce, mild spice for kids) — edit as cooked.
  v2.9.0 — Meal Bank is now fully editable: the expanded meal editor has a
           Name field (rename) and a "Delete meal" button. Custom meals are
           renamed/removed in place. Built-in UNIFIED_MEALS meals can't be
           changed in the hardcoded array, so: delete → name goes into
           hiddenMeals (localStorage mealrota_hidden_meals_v1) and allMeals()
           filters it out; rename → the built-in's name goes into renamedMeals
           (mealrota_renamed_meals_v1, also filtered, not restorable) and a custom copy
           (tags, ingredients, note, recipe) is saved under the new name.
           Renaming also updates any rota slots holding the old name. A
           "N deleted meals · restore" link at the bottom of the bank brings
           hidden built-ins back. Delete/rename work on the meal object itself,
           so two meals with the same name are handled separately.
  v2.8.1 — recipe card shows a photo at the top when the recipe has

           source site keeping the file; if it fails to load the banner just
           hides itself. Optional `imageCredit` shows as a small caption.
           First one: Lamb & feta flatbreads, photo from joyoliver.com.
  v2.8.0 — first recipe card. Meals can now carry an optional `recipe`
           object: { serves, time, intro, ingredients:[{qty, unit, item}],
           steps:[{title, text, timer (seconds, optional)}], notes }. Meals with
           one show a 📖 in the Meal Bank; opening the meal shows a "View
           recipe" button that opens a full recipe sheet with a servings −/+
           control (scales every quantity), numbered steps, and tap-to-start
           countdown timers on timed steps (vibrates when done). First recipe:

           tag (filter chip, picker chip, colour). The plain `ingredients`
           array is still what the Shopping tab uses. Recipes are built-in only

  v2.7.0 — the History tab's log fields (Lunch, Tea-adults, Tea-kids) now have

  v1.5.1 — removed the "edit" button from History entries to save space; the

  v1.5.0 — History tab: Tea split into separate "adults" and "kids" fields

           in focus — Lunch left as a single field). Old {lunch, tea} entries

  v1.4.1 — History tab fixes: entry edit button was getting visually covered by

  v1.2.1 — moved the version number out of the tiny footer into a visible badge

  LESSONS LEARNED (carried over from other apps in this family of tools)
  - Android doesn't overwrite same-named downloaded files, it appends a suffix
    (file-20.html etc) — always embed the version number in the filename.
  - Keep the meal bank reusable across rebuilds; it's the expensive part to
    maintain (tags), the grid/UI around it is cheap to redo.

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Meal Rota v2.11.1</title>

<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-2:#EEF1F5;
    --line:#D7DCE3;
    --paper:#26313F;
    --paper-dim:#5b6b7d;
    --muted:#6b7a8c;
    --mustard:#2F6FE4;
    --mustard-dim:#1f4fb0;
    --rose:#F0703C;
    --rose-dim:#c1541f;
    --today:#2FA84F;
    --c-chicken:#E0A23A;
    --c-beef:#C1443A;
    --c-pork:#C1854F;
    --c-fish:#2F8FA8;
    --c-veggie:#4C9A5D;
    --c-egg:#B99A2E;
    --c-lamb:#8E4B8A;
    --c-default:#8a97a8;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .display{font-family:'Patrick Hand',cursive;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header.top{
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 80%, transparent);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:0 0 2px;
  }
  h1.title{
    font-size:28px; margin:0;
  }
  .title-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 0 9px;
  }
  .version-badge{
    flex:none; font-size:11px; font-weight:600; color:var(--mustard);
    background:var(--surface); border:1px solid var(--mustard-dim);
    padding:4px 9px; border-radius:20px;
  }

  /* ── Rota dial: the signature element ── */
  .dial-row{display:flex; align-items:center; gap:10px;}
  .dial{
    position:relative; width:40px; height:40px; flex:none;
  }
  .dial svg{width:100%; height:100%; display:block;}
  .dial .now-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Patrick Hand',cursive; font-size:15px; color:var(--mustard);
  }
  .weeks-tabs{display:flex; gap:5px; flex:1;}
  .wk-tab{
    flex:1; text-align:center; padding:6px 0 5px; border-radius:9px;
    background:var(--surface); border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--paper-dim); cursor:pointer; position:relative;
    transition:background .15s, color .15s, border-color .15s;
  }
  .wk-tab .wk-sub{display:block; font-family:'Inter',sans-serif; font-size:8px; font-weight:500; letter-spacing:.06em; margin-top:1px; opacity:.7; text-transform:uppercase;}
  .wk-tab.active{background:var(--mustard); color:#ffffff; border-color:var(--mustard);}
  .wk-tab.is-now::after{
    content:"today"; position:absolute; top:-8px; right:6px;
    font-family:'Inter',sans-serif; font-size:7px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--today); color:#ffffff; padding:1px 4px; border-radius:5px; font-weight:700;
  }

  main{padding:10px 12px 0;}

  .day-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:11px;
    margin-bottom:6px;
    overflow:hidden;
  }
  .day-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px 4px 11px;
  }
  .day-name{font-family:'Patrick Hand',cursive; font-size:13px;}
  .day-head-right{display:flex; align-items:center; gap:6px;}
  .day-note{font-size:9px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .adults-toggle{
    flex:none; width:19px; height:19px; border-radius:50%;
    border:1px solid var(--rose-dim); background:none; color:var(--rose);
    font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;

  .slot-label{
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase;

  }

    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:12px 4px 6px;

  /* ── Meal bank sheet ── */

    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-width:520px; max-height:82vh;
    border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 12px;}

  .sheet-title{font-family:'Patrick Hand',cursive; font-size:21px;}
  .sheet-close{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px;}

  .chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 11px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--paper-dim);
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--mustard); color:#ffffff; border-color:var(--mustard);}
  .sheet-freetext-row{display:flex; gap:8px; margin-bottom:12px;}
  .sheet-freetext-input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;

</div>

</div>

// meals typed in via the Meal Bank's free-text field — merged with UNIFIED_MEALS at render time
const CUSTOM_MEALS_KEY = "mealrota_custom_meals_v1";
function loadCustomMeals(){
  try{ const raw = localStorage.getItem(CUSTOM_MEALS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return [];
}
function saveCustomMeals(m){ try{ localStorage.setItem(CUSTOM_MEALS_KEY, JSON.stringify(m)); }catch(e){} }
let customMeals = loadCustomMeals();
const HIDDEN_MEALS_KEY = "mealrota_hidden_meals_v1";
function loadHiddenMeals(){ try{ const raw = localStorage.getItem(HIDDEN_MEALS_KEY); if(raw) return JSON.parse(raw); }catch(e){} return []; }
function saveHiddenMeals(){ try{ localStorage.setItem(HIDDEN_MEALS_KEY, JSON.stringify(hiddenMeals)); }catch(e){} }
let hiddenMeals = loadHiddenMeals();
// built-ins that were renamed (replaced by a custom copy) — hidden too, but not "restorable"
const RENAMED_MEALS_KEY = "mealrota_renamed_meals_v1";
let renamedMeals = (()=>{ try{ return JSON.parse(localStorage.getItem(RENAMED_MEALS_KEY)) || []; }catch(e){ return []; } })();
function saveRenamedMeals(){ try{ localStorage.setItem(RENAMED_MEALS_KEY, JSON.stringify(renamedMeals)); }catch(e){} }
function allMeals(){ if(window.RECIPES_READY) customMeals.forEach(applyRecipeTo); return UNIFIED_MEALS.filter(m=> !hiddenMeals.includes(m.name) && !renamedMeals.includes(m.name)).concat(customMeals); }
function isCustomMeal(m){ return customMeals.includes(m); }
function deleteMeal(m){
  if(isCustomMeal(m)){ customMeals.splice(customMeals.indexOf(m), 1); saveCustomMeals(customMeals); }
  else if(!hiddenMeals.includes(m.name)){ hiddenMeals.push(m.name); saveHiddenMeals(); }
}
function renameInTemplate(oldName, newName){
  let changed = false;
  Object.values(template).forEach(wk=> Object.values(wk).forEach(day=>{
    ['lunch','tea'].forEach(slot=> ['family','adults'].forEach(who=>{
      if(day[slot] && day[slot][who] === oldName){ day[slot][who] = newName; changed = true; }
    }));
  }));
  if(changed) saveTemplate(template);
}
// returns the meal object now carrying the new name
function renameMeal(m, newName){
  const oldName = m.name;
  if(isCustomMeal(m)){
    // keep an auto-matched recipe when the name changes (make it saveable)
    if(m.recipe && !Object.keys(m).includes('recipe')){ const r = m.recipe; delete m.recipe; m.recipe = r; }
    m.name = newName; saveCustomMeals(customMeals); renameInTemplate(oldName, newName); return m; }
  const copy = {name:newName, tags:[...m.tags]};
  if(m.ingredients) copy.ingredients = [...m.ingredients];
  if(m.note) copy.note = m.note;
  if(m.recipe) copy.recipe = JSON.parse(JSON.stringify(m.recipe));
  customMeals.push(copy); saveCustomMeals(customMeals);
  if(!renamedMeals.includes(oldName)){ renamedMeals.push(oldName); saveRenamedMeals(); }
  renameInTemplate(oldName, newName);
  return copy;
}

// edited tags for built-in UNIFIED_MEALS meals (can't be edited in place since
// UNIFIED_MEALS is redefined fresh from the hardcoded array on every load) —
// applied on top of UNIFIED_MEALS right after it's defined, so every other
// code path can just keep reading m.tags normally, no refactor needed.
const TAG_OVERRIDES_KEY = "mealrota_tag_overrides_v1";
function loadTagOverrides(){
  try{ const raw = localStorage.getItem(TAG_OVERRIDES_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {}; // { mealName: tags[] }
}
function saveTagOverrides(o){ try{ localStorage.setItem(TAG_OVERRIDES_KEY, JSON.stringify(o)); }catch(e){} }
let tagOverrides = loadTagOverrides();
(function applyTagOverrides(){
  Object.keys(tagOverrides).forEach(name=>{
    const m = UNIFIED_MEALS.find(x=> x.name === name);
    if(m) m.tags = tagOverrides[name];
  });
})();

// edit any meal's tags after the fact — custom meals update in place, built-in
// meals go through the override map above
function updateMealTags(name, newTags){
  const custom = customMeals.find(m=> m.name === name);
  if(custom){
    custom.tags = newTags;
    saveCustomMeals(customMeals);
    return;
  }
  const builtin = UNIFIED_MEALS.find(m=> m.name === name);
  if(builtin){
    builtin.tags = newTags;
    tagOverrides[name] = newTags;
    saveTagOverrides(tagOverrides);
  }
}

// same pattern as tags, for each meal's ingredient list (used to build the
// shopping list — most built-in meals start with no ingredients recorded)
const INGREDIENT_OVERRIDES_KEY = "mealrota_ingredient_overrides_v1";
function loadIngredientOverrides(){
  try{ const raw = localStorage.getItem(INGREDIENT_OVERRIDES_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {}; // { mealName: ingredients[] }
}
function saveIngredientOverrides(o){ try{ localStorage.setItem(INGREDIENT_OVERRIDES_KEY, JSON.stringify(o)); }catch(e){} }
let ingredientOverrides = loadIngredientOverrides();
(function applyIngredientOverrides(){
  Object.keys(ingredientOverrides).forEach(name=>{
    const m = UNIFIED_MEALS.find(x=> x.name === name);
    if(m) m.ingredients = ingredientOverrides[name];
  });
})();
function updateMealIngredients(name, newIngredients){
  const custom = customMeals.find(m=> m.name === name);
  if(custom){
    custom.ingredients = newIngredients;
    saveCustomMeals(customMeals);
    return;
  }
  const builtin = UNIFIED_MEALS.find(m=> m.name === name);
  if(builtin){
    builtin.ingredients = newIngredients;
    ingredientOverrides[name] = newIngredients;
    saveIngredientOverrides(ingredientOverrides);
  }
}
function ingredientsOf(m){ return m.ingredients || []; }

function buildRecipe(name){

    serves:d.serves, time:d.time, intro:d.intro, notes:d.notes,
    ingredients: d.i.map(([qty,unit,item])=> ({qty, unit, item})),

  };

  return r;
}

  if(m.recipe) return;
  const key = RECIPE_INDEX[RECIPE_KEY(m.name)];
  if(!key) return;
  // non-enumerable: not saved into localStorage with custom meals
  Object.defineProperty(m, 'recipe', {value: buildRecipe(key), writable:true, configurable:true, enumerable:false});
}

const STORE_KEY = "mealrota_template_v1";
const ANCHOR_KEY = "mealrota_anchor_v1"; // Monday date string that = start of Week A

function loadTemplate(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
}
function saveTemplate(t){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(t)); }catch(e){}
}
function getAnchorMonday(){
  let a = localStorage.getItem(ANCHOR_KEY);
  if(!a){
    // default anchor: the most recent Monday
    const now = new Date();
    const day = now.getDay(); // 0 Sun .. 6 Sat
    const diff = (day===0? -6 : 1-day);
    const monday = new Date(now); monday.setDate(now.getDate()+diff);
    a = monday.toISOString().slice(0,10);
    localStorage.setItem(ANCHOR_KEY, a);
  }
  return new Date(a+"T00:00:00");
}
function currentWeekIndex(){
  const anchor = getAnchorMonday();
  const now = new Date();
  const day = now.getDay();
  const diff = (day===0? -6 : 1-day);
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate()+diff);
  const weeksSince = Math.round((thisMonday - anchor) / (7*24*3600*1000));
  return ((weeksSince % 4) + 4) % 4; // 0..3
}

let template = loadTemplate();
let activeWeek = WEEK_KEYS[currentWeekIndex()];
let sheetTarget = null; // {week, day, slot: 'lunch'|'tea', who: 'family'|'adults'}
let sheetFilter = null; // active tag chip

function weekAndDayForDate(dateStr){
  // dateStr: 'YYYY-MM-DD'. Returns {weekKey, dayKey}.
  const anchor = getAnchorMonday();
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  const thatMonday = new Date(d); thatMonday.setDate(d.getDate()+diff);
  const weeksSince = Math.round((thatMonday - anchor) / (7*24*3600*1000));
  const idx = ((weeksSince % 4) + 4) % 4;
  const dayKey = DAYS[(day===0?6:day-1)].key;
  return {weekKey: WEEK_KEYS[idx], dayKey};
}

    el.onclick = ()=>{ activeWeek = wk; renderAll(); };
    tabs.appendChild(el);

}
function countFilled(wk){
  let n=0;
  DAYS.forEach(d=>{
    const day = template[wk][d.key];
    if(day.lunch.family) n++;
    if(day.tea.family || day.tea.adults) n++;
  });
  return n;
}

const CHIP_TAGS = ["quick","medium","slow","chicken","beef","pork","lamb","fish","veggie","egg","pasta","curry"];

// shared: as the person types into a free-text field, show a dropdown of matching existing meals
function wireAutocomplete(inputEl, dropdownEl, onPick){
  inputEl.addEventListener('input', ()=>{
    const val = inputEl.value.trim().toLowerCase();
    if(val.length < 1){ dropdownEl.classList.remove('open'); dropdownEl.innerHTML=''; return; }
    const matches = allMeals().filter(m=> m.name.toLowerCase().includes(val)).slice(0, 6);
    if(matches.length === 0){ dropdownEl.classList.remove('open'); dropdownEl.innerHTML=''; return; }
    dropdownEl.innerHTML = matches.map(m=>
      `<div class="freetext-suggestion" data-name="${escapeHtml(m.name)}">
        <span>${escapeHtml(m.name)}</span>
        <span class="freetext-suggestion-tags mono">${m.tags.filter(t=>t!=='lunch'&&t!=='tea').slice(0,3).join(' · ')}</span>
      </div>`
    ).join('');
    dropdownEl.classList.add('open');
    dropdownEl.querySelectorAll('.freetext-suggestion').forEach(el=>{
      el.onclick = ()=>{
        onPick(el.dataset.name);
        dropdownEl.classList.remove('open');
        dropdownEl.innerHTML='';
      };
    });
  });
}

const PROTEIN_TAGS = ["chicken","beef","pork","lamb","fish","veggie","egg"];

let bankProtein = null;   // one of PROTEIN_TAGS or null
let bankSpeed = null;     // one of SPEED_TAGS or null
let bankWhen = null;      // "lunch" | "teaAdults" | "teaKids" | null
let bankSort = "name";    // "name" | "protein" | "speed"

function proteinOf(m){ return PROTEIN_TAGS.find(t=> m.tags.includes(t)) || null; }
function speedOf(m){ return SPEED_TAGS.find(t=> m.tags.includes(t)) || null; }
function pillColor(m){

function matchesBankWhen(m){
  if(!bankWhen) return true;

let bankExpanded = new Set(); // meal names currently showing the tag editor
let bankTagDraft = {};        // meal name -> draft tags array while editing

const WHEN_TAGS = ["lunch","tea"];
const WHO_TAGS = ["everyone","adults","kids"];

function buildTagEditor(m){
  const wrap = document.createElement('div');
  wrap.className = 'tag-editor';
  const draft = bankTagDraft[m.name];

  if(m.recipe){
    const recipeBtn = document.createElement('button');
    recipeBtn.className = 'recipe-open-btn';
    recipeBtn.textContent = '📖 View recipe';
    recipeBtn.onclick = (e)=>{ e.stopPropagation(); setTimeout(()=> openRecipe(m), 0); };
    wrap.appendChild(recipeBtn);
  }

  const nameGroup = document.createElement('div');
  nameGroup.className = 'tag-editor-group';
  nameGroup.innerHTML = `<div class="tag-editor-label">Name</div>`;
  const nameInput = document.createElement('input');
  nameInput.type = 'text'; nameInput.className = 'meal-name-input'; nameInput.value = m.name;
  nameGroup.appendChild(nameInput);
  wrap.appendChild(nameGroup);

  if(m.note){
    const noteEl = document.createElement('div');
    noteEl.className = 'bank-pill-tags mono';
    noteEl.textContent = m.note;
    noteEl.style.marginBottom = '6px';
    wrap.appendChild(noteEl);
  }

  function chipRow(groupLabel, options, multiSelect){
    const group = document.createElement('div');
    group.className = 'tag-editor-group';
    group.innerHTML = `<div class="tag-editor-label">${groupLabel}</div>`;
    const row = document.createElement('div');
    row.className = 'tag-editor-row';
    options.forEach(opt=>{
      const chip = document.createElement('div');
      chip.className = 'tag-editor-chip' + (draft.includes(opt) ? ' on' : '');
      chip.textContent = opt;
      chip.onclick = ()=>{
        if(multiSelect){
          if(draft.includes(opt)) draft.splice(draft.indexOf(opt), 1);
          else draft.push(opt);
        } else {
          // single-select within this option group: clear any other option from
          // this same group first, then toggle this one
          options.forEach(o=>{ const i = draft.indexOf(o); if(i>-1) draft.splice(i,1); });
          if(!chip.classList.contains('on')) draft.push(opt);
        }
        renderBankList();
      };
      row.appendChild(chip);
    });
    group.appendChild(row);
    return group;
  }

  wrap.appendChild(chipRow('When', WHEN_TAGS, true));
  wrap.appendChild(chipRow('Who', WHO_TAGS, true));
  wrap.appendChild(chipRow('Protein', PROTEIN_TAGS, false));
  wrap.appendChild(chipRow('Speed', SPEED_TAGS, false));

  const ingredientsGroup = document.createElement('div');
  ingredientsGroup.className = 'tag-editor-group';
  ingredientsGroup.innerHTML = `<div class="tag-editor-label">Ingredients (one per line — used for the shopping list)</div>`;
  const ingredientsBox = document.createElement('textarea');
  ingredientsBox.className = 'tag-editor-ingredients';
  ingredientsBox.rows = 4;
  ingredientsBox.placeholder = 'e.g.\n500g minced beef\n1 onion\n2 cloves garlic';
  ingredientsBox.value = (m.ingredients || []).join('\n');
  ingredientsGroup.appendChild(ingredientsBox);
  wrap.appendChild(ingredientsGroup);

  const saveBtn = document.createElement('button');
  saveBtn.className = 'tag-editor-save';
  saveBtn.textContent = 'Save';
  saveBtn.onclick = ()=>{
    const oldName = m.name;
    const newName = nameInput.value.trim();
    const ingredients = ingredientsBox.value.split('\n').map(s=>s.trim()).filter(Boolean);
    let target = m;
    if(newName && newName !== oldName){
      if(allMeals().some(x=> x !== m && x.name.toLowerCase() === newName.toLowerCase())){
        alert(`There's already a meal called "${newName}".`); return;
      }
      target = renameMeal(m, newName);
    }
    target.tags = [...draft];
    target.ingredients = ingredients;
    if(isCustomMeal(target)) saveCustomMeals(customMeals);
    else { updateMealTags(target.name, [...draft]); updateMealIngredients(target.name, ingredients); }
    bankExpanded.delete(oldName);
    delete bankTagDraft[oldName];
    setTimeout(renderBankList, 0);
  };
  wrap.appendChild(saveBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'meal-delete-btn';
  delBtn.textContent = 'Delete meal';
  delBtn.onclick = ()=>{
    if(!confirm(`Delete "${m.name}" from the meal bank?\n\nAny rota slots already set to it stay as they are.`)) return;
    deleteMeal(m);
    bankExpanded.delete(m.name);
    delete bankTagDraft[m.name];
    setTimeout(renderBankList, 0);
  };
  wrap.appendChild(delBtn);

  return wrap;
}

let recipeMeal = null, recipeServes = 4, recipeGot = new Set(), recipeTimers = {};
function fmtQty(q){
  if(q==null || q===0) return '';
  const whole = Math.floor(q), frac = q - whole;
  const fr = [[0.25,'¼'],[0.333,'⅓'],[0.5,'½'],[0.667,'⅔'],[0.75,'¾']];
  if(frac < 0.08) return String(whole);
  if(frac > 0.92) return String(whole+1);
  let best = null; for(const [v,g] of fr){ if(Math.abs(frac-v) < 0.09 && (!best || Math.abs(frac-v) < Math.abs(frac-best[0]))) best=[v,g]; }
  if(best) return (whole? whole : '') + best[1];
  return (Math.round(q*10)/10).toString();
}
function scaledQty(ing){
  const r = recipeMeal.recipe;
  if(ing.qty == null) return '–';
  let q = ing.qty * recipeServes / r.serves;
  if(ing.unit==='kg'){ return (Math.round(q*10)/10) + 'kg'; }
  if(ing.unit==='g' || ing.unit==='ml'){ q = q>=100 ? Math.round(q/25)*25 : Math.round(q/5)*5; return q + ing.unit; }
  const t = fmtQty(q);
  return ing.unit ? `${t} ${ing.unit}` : t;
}
function fmtTime(sec){ const m = Math.floor(sec/60), s2 = sec%60; return `${m}:${String(s2).padStart(2,'0')}`; }
function stopAllRecipeTimers(){ Object.values(recipeTimers).forEach(t=> clearInterval(t.id)); recipeTimers = {}; }
function openRecipe(m){
  if(!m || !m.recipe) return;
  if(recipeMeal !== m){ stopAllRecipeTimers(); recipeGot = new Set(); recipeServes = m.recipe.serves; }
  recipeMeal = m;
  document.getElementById('recipeTitle').textContent = m.name;
  renderRecipe();
  document.getElementById('recipeBackdrop').classList.add('open');
}
function closeRecipe(){ document.getElementById('recipeBackdrop').classList.remove('open'); }
document.getElementById('recipeClose').onclick = closeRecipe;
document.getElementById('recipeBackdrop').onclick = (e)=>{ if(e.target.id==='recipeBackdrop') closeRecipe(); };
function renderRecipe(){
  const r = recipeMeal.recipe;
  const body = document.getElementById('recipeBody');
  body.innerHTML = '';
  if(r.image){
    const hero = document.createElement('div'); hero.className = 'recipe-hero';
    const img = document.createElement('img'); img.src = r.image; img.alt = recipeMeal.name; img.referrerPolicy = 'no-referrer';
    img.onerror = ()=> hero.remove();
    hero.appendChild(img);
    if(r.imageCredit){ const c = document.createElement('span'); c.className = 'recipe-hero-credit'; c.textContent = r.imageCredit; hero.appendChild(c); }
    body.appendChild(hero);
  }
  if(r.intro){ const p = document.createElement('p'); p.className='recipe-intro'; p.textContent = r.intro; body.appendChild(p); }

  const meta = document.createElement('div'); meta.className = 'recipe-meta';
  meta.innerHTML = `<span class="recipe-time">${escapeHtml(r.time||'')}</span>
    <span class="recipe-serves"><button data-d="-1">−</button><span>Serves ${recipeServes}</span><button data-d="1">+</button></span>`;
  meta.querySelectorAll('button').forEach(b=> b.onclick = ()=>{
    recipeServes = Math.max(1, Math.min(12, recipeServes + Number(b.dataset.d)));
    setTimeout(renderRecipe, 0);
  });
  body.appendChild(meta);

  const h1 = document.createElement('div'); h1.className='recipe-h'; h1.textContent='Ingredients · tap to tick off'; body.appendChild(h1);
  const ul = document.createElement('ul'); ul.className = 'recipe-ing';
  r.ingredients.forEach((ing, i)=>{
    const li = document.createElement('li');
    if(recipeGot.has(i)) li.className = 'got';
    li.innerHTML = `<span class="q">${escapeHtml(scaledQty(ing))}</span><span>${escapeHtml(ing.item)}</span>`;
    li.onclick = ()=>{ recipeGot.has(i) ? recipeGot.delete(i) : recipeGot.add(i); li.classList.toggle('got'); };
    ul.appendChild(li);
  });
  body.appendChild(ul);

  const h2 = document.createElement('div'); h2.className='recipe-h'; h2.textContent='Method'; body.appendChild(h2);
  r.steps.forEach((st, i)=>{
    const row = document.createElement('div'); row.className = 'recipe-step';
    row.innerHTML = `<div class="recipe-step-n">${i+1}</div><div><div class="recipe-step-t">${escapeHtml(st.title)}</div><div class="recipe-step-x">${escapeHtml(st.text)}</div></div>`;
    if(st.timer){
      const btn = document.createElement('button'); btn.className = 'recipe-timer';
      const paint = ()=>{
        const t = recipeTimers[i];
        if(!t){ btn.className='recipe-timer'; btn.textContent = `⏱ Start ${fmtTime(st.timer)}`; }
        else if(t.left<=0){ btn.className='recipe-timer done'; btn.textContent = '✓ Done — tap to reset'; }
        else { btn.className='recipe-timer running'; btn.textContent = `⏱ ${fmtTime(t.left)} — tap to stop`; }
      };
      btn.onclick = ()=>{
        const t = recipeTimers[i];
        if(t){ clearInterval(t.id); delete recipeTimers[i]; paint(); return; }
        const tt = {left: st.timer, end: Date.now() + st.timer*1000};
        tt.id = setInterval(()=>{
          tt.left = Math.max(0, Math.round((tt.end - Date.now())/1000));
          if(tt.left<=0){ clearInterval(tt.id); try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){} }
          if(document.body.contains(btn)) paint();
        }, 1000);
        recipeTimers[i] = tt; paint();
      };
      paint();
      row.lastElementChild.appendChild(btn);
    }
    body.appendChild(row);
  });

  if(r.notes){ const n = document.createElement('div'); n.className='recipe-notes'; n.textContent = '💡 ' + r.notes; body.appendChild(n); }
}

function renderBankList(){

function renderBankListInner(){
  const list = document.getElementById('bankList');
  list.innerHTML = '';

  let meals = allMeals();
  if(bankWhen) meals = meals.filter(matchesBankWhen);
  if(bankProtein) meals = meals.filter(m=> m.tags.includes(bankProtein));
  if(bankSpeed) meals = meals.filter(m=> m.tags.includes(bankSpeed));

  if(meals.length===0){
    list.innerHTML = `<div class="bank-empty">No meals match those filters.</div>`;
    return;
  }

  function renderPillGroup(container, mealsIn){
    const pillWrap = document.createElement('div');
    pillWrap.className = 'bank-pill-wrap';
    mealsIn.slice().sort((a,b)=> a.name.localeCompare(b.name)).forEach(m=>{
      const pill = document.createElement('div');
      pill.className = 'bank-pill';
      pill.style.borderLeftColor = pillColor(m);
      pill.textContent = m.recipe ? `${m.name} 📖` : m.name;
      pill.onclick = ()=>{
        if(bankExpanded.has(m.name)){ bankExpanded.delete(m.name); delete bankTagDraft[m.name]; }
        else { bankExpanded.add(m.name); bankTagDraft[m.name] = [...m.tags]; }
        renderBankList();
      };
      pillWrap.appendChild(pill);
      if(bankExpanded.has(m.name)){
        pillWrap.appendChild(buildTagEditor(m));
      }
    });
    container.appendChild(pillWrap);
  }

  if(bankSort === 'name'){
    renderPillGroup(list, meals);
  } else {
    const groupTags = bankSort === 'protein' ? PROTEIN_TAGS : SPEED_TAGS;
    groupTags.forEach(tag=>{
      const inGroup = meals.filter(m=> m.tags.includes(tag));
      if(inGroup.length===0) return;
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = tag;
      list.appendChild(title);
      renderPillGroup(list, inGroup);
    });
    const rest = meals.filter(m=> !groupTags.some(t=> m.tags.includes(t)));
    if(rest.length){
      const title = document.createElement('div');
      title.className = 'bank-group-title';
      title.textContent = 'other';
      list.appendChild(title);
      renderPillGroup(list, rest);
    }
  }
}

const HISTORY_KEY = "mealrota_history_v1";

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw){
      const h = JSON.parse(raw);
      // migrate old {lunch, tea} entries to {lunch, teaAdults, teaKids}
      Object.keys(h).forEach(d=>{
        if(h[d].tea !== undefined && h[d].teaAdults === undefined && h[d].teaKids === undefined){
          h[d].teaAdults = h[d].tea;
          h[d].teaKids = '';
          delete h[d].tea;
        }
      });
      return h;
    }
  }catch(e){}
  return {}; // { 'YYYY-MM-DD': {lunch:'', teaAdults:'', teaKids:''} }
}
function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){} }

let historyDayFilter = null; // e.g. 'mon' or null for all

      entry.lunch ? `<b>L</b> ${escapeHtml(entry.lunch)}` : '',
      entry.teaAdults ? `<b>TA</b> ${escapeHtml(entry.teaAdults)}` : '',
      entry.teaKids ? `<b>TK</b> ${escapeHtml(entry.teaKids)}` : '',
    ].filter(Boolean).join('  ·  ');
    return `
      <div class="history-entry${d===historyEditDate ? ' editing' : ''}" data-date="${d}">
        <span class="history-entry-day">${SHORT_DAY[dayKey]}</span>
        <span class="history-entry-date">${dateLabel}</span>
        <span class="history-entry-meals">${meals}</span>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.history-entry').forEach(row=>{
    row.onclick = ()=>{ historyEditDate = row.dataset.date; renderHistoryView(); window.scrollTo({top:0, behavior:'smooth'}); };
  });
}

/* ───────────────────────── Shopping list ───────────────────────── */
const SHOPPING_CHECKED_KEY = "mealrota_shopping_checked_v1";
function loadShoppingChecked(){
  try{ const raw = localStorage.getItem(SHOPPING_CHECKED_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {}; // { itemTextLowercase: true }
}
function saveShoppingChecked(c){ try{ localStorage.setItem(SHOPPING_CHECKED_KEY, JSON.stringify(c)); }catch(e){} }
let shoppingChecked = loadShoppingChecked();
let shoppingWeek = WEEK_KEYS[currentWeekIndex()];

function buildShoppingList(weekKey){
  const mealNames = new Set();
  DAYS.forEach(d=>{
    const day = template[weekKey][d.key];
    [day.lunch.family, day.lunch.adults, day.tea.family, day.tea.adults].forEach(name=>{
      if(name) mealNames.add(name);
    });
  });

  const ingredientMap = new Map(); // lowercase -> original-case display text
  const missingIngredients = []; // meal names found in bank but with no ingredients recorded
  const unmatchedMeals = []; // meal names not in the bank at all (typed free-text, not saved)

  mealNames.forEach(name=>{
    const m = allMeals().find(x=> x.name === name);
    if(!m){ unmatchedMeals.push(name); return; }
    const ing = ingredientsOf(m);
    if(ing.length === 0){ missingIngredients.push(name); return; }
    ing.forEach(item=>{
      const key = item.toLowerCase();
      if(!ingredientMap.has(key)) ingredientMap.set(key, item);
    });
  });

  const items = [...ingredientMap.values()].sort((a,b)=> a.localeCompare(b));
  return { items, missingIngredients, unmatchedMeals, mealCount: mealNames.size };
}

function renderShoppingView(){
  const view = document.getElementById('shoppingView');
  const { items, missingIngredients, unmatchedMeals, mealCount } = buildShoppingList(shoppingWeek);

  view.innerHTML = `
    <div class="shopping-controls">
      <div class="bank-filter-label">Shopping list for</div>
      <div class="bank-chip-row" id="shoppingWeekChips"></div>
    </div>
    <div class="section-label">${items.length} item${items.length===1?'':'s'} · ${mealCount} meal${mealCount===1?'':'s'} planned</div>
    <div id="shoppingItems"></div>
    ${(missingIngredients.length || unmatchedMeals.length) ? `
      <div class="section-label">Needs attention</div>
      <div class="shopping-missing">
        ${missingIngredients.length ? `<b>No ingredients recorded yet</b> — add them via Meal Bank: ${missingIngredients.map(escapeHtml).join(', ')}<br>` : ''}
        ${unmatchedMeals.length ? `<b>Not in the meal bank</b> (typed without saving) — ingredients unknown: ${unmatchedMeals.map(escapeHtml).join(', ')}` : ''}
      </div>
    ` : ''}
    ${items.length ? `<div style="padding:14px 4px 0;"><button class="shopping-clear-btn" id="shoppingClearBtn">clear all checks</button></div>` : ''}
  `;

  const weekChips = document.getElementById('shoppingWeekChips');
  WEEK_KEYS.forEach(wk=>{
    const chip = document.createElement('div');
    chip.className = 'bank-chip' + (shoppingWeek===wk ? ' active':'');
    chip.textContent = `Week ${wk}`;
    chip.onclick = ()=>{ shoppingWeek = wk; renderShoppingView(); };
    weekChips.appendChild(chip);
  });

  const itemsWrap = document.getElementById('shoppingItems');
  if(items.length===0){
    itemsWrap.innerHTML = `<div class="bank-empty">No ingredients to show — either no meals are planned for this week, or the planned meals don't have ingredients recorded yet.</div>`;
  } else {
    items.forEach(item=>{
      const key = item.toLowerCase();
      const row = document.createElement('div');
      row.className = 'shopping-item' + (shoppingChecked[key] ? ' checked' : '');
      row.innerHTML = `<input type="checkbox" ${shoppingChecked[key] ? 'checked' : ''}><span class="shopping-item-label">${escapeHtml(item)}</span>`;
      row.querySelector('input').onchange = (e)=>{
        if(e.target.checked) shoppingChecked[key] = true; else delete shoppingChecked[key];
        saveShoppingChecked(shoppingChecked);
        row.classList.toggle('checked', e.target.checked);
      };
      itemsWrap.appendChild(row);
    });
  }

  const clearBtn = document.getElementById('shoppingClearBtn');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      items.forEach(item=> delete shoppingChecked[item.toLowerCase()]);
      saveShoppingChecked(shoppingChecked);
      renderShoppingView();
    };
  }
}

/* ───────────────────────── View switcher ───────────────────────── */
let currentView = 'history';
function setView(v){
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('mainGrid').style.display = v==='rota' ? '' : 'none';
  document.getElementById('bankView').style.display = v==='bank' ? '' : 'none';
  document.getElementById('historyView').style.display = v==='history' ? '' : 'none';
  document.getElementById('shoppingView').style.display = v==='shopping' ? '' : 'none';
  if(v==='rota') renderAll();
  if(v==='bank') renderBankView();
  if(v==='history') renderHistoryView();
  if(v==='shopping') renderShoppingView();
}
document.querySelectorAll('.view-btn').forEach(b=>{
  b.onclick = ()=> setView(b.dataset.view);
});

/* ───────────────────────── Boot ───────────────────────── */
function renderAll(){ renderHeader(); renderGrid(); }
document.getElementById('versionBadge').textContent = `v${APP_VERSION}`;
document.title = `Meal Rota v${APP_VERSION}`;
renderHeader(); // dial + week tabs still needed even when History is the landing view
renderHistoryView();
